[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "md-report-maker"
version = "0.1.0"
description = "マークダウン形式レポートメーカー"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
md-report-maker = "md_report_maker.main:main"
